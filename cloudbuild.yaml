# Kredibel CI/CD Pipeline
# See docs/16-infrastructure-and-deployment.md §8

steps:
  # 1-3. Gates (docs/16 §8). Visual tests run locally until Linux baselines exist (docs/20).
  - name: 'python:3.12-slim'
    id: 'backend-check'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        # pyright runs on a Node binary that needs libatomic, which the slim image lacks.
        apt-get update -qq && apt-get install -y -qq --no-install-recommends libatomic1 >/dev/null
        pip install --quiet uv
        cd backend
        uv sync --frozen
        uv run ruff check .
        uv run pyright
        uv run lint-imports
        uv run python ../tools/checks/no_long_prompts.py
        uv run python ../tools/checks/schema_drift.py
        uv run pytest -q

  - name: 'node:22'
    id: 'frontend-check'
    waitFor: ['-']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        python3 tools/design/build_tokens.py --check
        python3 tools/checks/no_raw_styles.py
        cd frontend
        npm ci
        npm run gen:api
        npm run lint
        npm run check
        npx vitest --run

  - name: 'python:3.12-slim'
    id: 'secret-scan'
    waitFor: ['-']
    entrypoint: 'bash'
    args: ['-c', 'python tools/checks/scan_secrets.py']

  # 2. Build multi-stage container image. The SPA's Firebase config comes from the kredibel-env
  #    secret (ADR-024); a build without an API key would ship a SPA nobody can sign in to.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    waitFor: ['backend-check', 'frontend-check', 'secret-scan']
    entrypoint: 'bash'
    secretEnv: ['KREDIBEL_ENV']
    args:
      - '-c'
      - |
        set -euo pipefail
        env_value() {
          printf '%s\n' "$$KREDIBEL_ENV" | sed -n "s/^$$1=//p" | tail -n 1 \
            | sed -e 's/^"\(.*\)"$$/\1/' -e "s/^'\(.*\)'$$/\1/"
        }
        api_key="$$(env_value VITE_FIREBASE_API_KEY)"
        [ -n "$$api_key" ] || { echo "VITE_FIREBASE_API_KEY is empty in kredibel-env"; exit 1; }
        docker build \
          --build-arg VITE_FIREBASE_API_KEY="$$api_key" \
          --build-arg VITE_FIREBASE_AUTH_DOMAIN="$$(env_value VITE_FIREBASE_AUTH_DOMAIN)" \
          --build-arg VITE_FIREBASE_PROJECT_ID="$$(env_value VITE_FIREBASE_PROJECT_ID)" \
          --build-arg VITE_FIREBASE_APP_ID="$$(env_value VITE_FIREBASE_APP_ID)" \
          --build-arg VITE_FIRESTORE_DATABASE="$$(env_value VITE_FIRESTORE_DATABASE)" \
          --build-arg VITE_APP_VERSION="$_COMMIT_SHA" \
          --build-arg APP_VERSION="$_COMMIT_SHA" \
          -t "asia-southeast1-docker.pkg.dev/$PROJECT_ID/kredibel/app:$_COMMIT_SHA" \
          -t "asia-southeast1-docker.pkg.dev/$PROJECT_ID/kredibel/app:latest" \
          .

  # 3. Push container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/kredibel/app:$_COMMIT_SHA'
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args:
      - 'push'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/kredibel/app:latest'

  # 5a. Deploy Firestore indexes and rules
  - name: 'node:22-slim'
    id: 'firestore-indexes'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Kredibel's database only (firebase.json, ADR-021); the CLI is pinned so its rules stay put.
        npx --yes firebase-tools@14.27.0 deploy --only firestore --project "$PROJECT_ID" --config firebase.json --non-interactive

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'firestore-indexes-ready'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        # Queries on new indexes fail until they are READY; wait up to 15 minutes.
        for i in $$(seq 1 90); do
          pending=$$(gcloud firestore indexes composite list --database=kredibel --format='value(state)' | grep -cv READY || true)
          [ "$$pending" = "0" ] && exit 0
          echo "$$pending index(es) still building..."; sleep 10
        done
        echo "Firestore indexes not READY after 15 minutes"; exit 1

  # 5b. Migrations (docs/22 §7): dry run, then run; a real run with pending migrations exports the
  #     database first under the job's own service account. A FAILED migration stops the release.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'migrate'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        gcloud run jobs deploy kredibel-migrate \
          --image="asia-southeast1-docker.pkg.dev/$PROJECT_ID/kredibel/app:$_COMMIT_SHA" \
          --region=asia-southeast1 \
          --service-account="kredibel-migrate@$PROJECT_ID.iam.gserviceaccount.com" \
          --set-env-vars=APP_ROLE=migrate,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FIRESTORE_DATABASE=kredibel,BACKUPS_BUCKET=$PROJECT_ID-kredibel-backups,MIGRATION_EXPORT_BEFORE_RUN=true \
          --command=python --args=-m,migrations,run \
          --tasks=1 --max-retries=1 --task-timeout=3600s --cpu=1 --memory=1Gi \
          --labels=app=kredibel,component=migrate
        gcloud run jobs execute kredibel-migrate --args=-m,migrations,run,--dry-run --region=asia-southeast1 --wait
        gcloud run jobs execute kredibel-migrate --args=-m,migrations,run --region=asia-southeast1 --wait

  # 6. Deploy worker service (IAM authenticated only)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-worker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        # The worker queues month runs to itself, so it needs its own URL as WORKER_URL. On the very
        # first deploy the URL exists only afterwards, so it is set right after.
        WORKER_URL=$$(gcloud run services describe kredibel-worker --region=asia-southeast1 --format='value(status.url)' 2>/dev/null || true)
        cp infra/env.worker.yaml infra/env.worker.resolved.yaml
        [ -n "$$WORKER_URL" ] && echo "WORKER_URL: \"$$WORKER_URL\"" >> infra/env.worker.resolved.yaml
        gcloud run deploy kredibel-worker \
          --image="asia-southeast1-docker.pkg.dev/$PROJECT_ID/kredibel/app:$_COMMIT_SHA" \
          --region=asia-southeast1 \
          --no-allow-unauthenticated \
          --service-account="kredibel-worker@$PROJECT_ID.iam.gserviceaccount.com" \
          --cpu=2 --memory=2Gi --concurrency=4 --timeout=900 \
          --max-instances=3 --labels=app=kredibel,component=worker \
          --set-secrets=/secrets/.env=kredibel-env:latest \
          --env-vars-file=infra/env.worker.resolved.yaml
        if [ -z "$$WORKER_URL" ]; then
          WORKER_URL=$$(gcloud run services describe kredibel-worker --region=asia-southeast1 --format='value(status.url)')
          gcloud run services update kredibel-worker --region=asia-southeast1 --update-env-vars="WORKER_URL=$$WORKER_URL"
        fi

  # 7. Deploy web service (public HTTPS)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-web'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        WORKER_URL=$$(gcloud run services describe kredibel-worker --region=asia-southeast1 --format='value(status.url)')
        cp infra/env.web.yaml infra/env.web.resolved.yaml
        echo "WORKER_URL: \"$$WORKER_URL\"" >> infra/env.web.resolved.yaml
        gcloud run deploy kredibel-web \
          --image="asia-southeast1-docker.pkg.dev/$PROJECT_ID/kredibel/app:$_COMMIT_SHA" \
          --region=asia-southeast1 \
          --allow-unauthenticated \
          --service-account="kredibel-web@$PROJECT_ID.iam.gserviceaccount.com" \
          --cpu=1 --memory=1Gi --concurrency=40 --timeout=60 \
          --max-instances=5 --labels=app=kredibel,component=web \
          --set-secrets=/secrets/.env=kredibel-env:latest \
          --env-vars-file=infra/env.web.resolved.yaml
        gcloud run services add-iam-policy-binding kredibel-web --region=asia-southeast1 --member=allUsers --role=roles/run.invoker || true

  # 8. Extract the built SPA from the image and deploy it to Firebase Hosting (ADR-018)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'extract-dist'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        # The image keeps the SPA build in /app/static (Dockerfile stage 2); Hosting serves the
        # same files so the two front doors never drift (ADR-018).
        id=$$(docker create asia-southeast1-docker.pkg.dev/$PROJECT_ID/kredibel/app:$_COMMIT_SHA)
        docker cp $$id:/app/static frontend/dist
        docker rm $$id

  - name: 'node:22-slim'
    id: 'deploy-hosting'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npx --yes firebase-tools deploy --only hosting --project "$PROJECT_ID"

  # 9. Smoke verification
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'smoke'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        WEB_URL=$$(gcloud run services describe kredibel-web --region=asia-southeast1 --format='value(status.url)')
        # AC-001-8: both front doors must report the version this build just deployed.
        for url in "$$WEB_URL" "https://kredibel-app.web.app"; do
          body=$$(curl -fsS "$$url/api/health")
          echo "$$url/api/health -> $$body"
          echo "$$body" | grep -q "\"version\":\"$_COMMIT_SHA\"" || { echo "expected version $_COMMIT_SHA"; exit 1; }
        done

images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/kredibel/app:$_COMMIT_SHA'
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/kredibel/app:latest'

availableSecrets:
  secretManager:
    - versionName: 'projects/$PROJECT_ID/secrets/kredibel-env/versions/latest'
      env: 'KREDIBEL_ENV'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _COMMIT_SHA: 'latest'
