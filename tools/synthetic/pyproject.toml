[project]
name = "kredibel-synth"
version = "0.1.0"
description = "Deterministic synthetic books for Kredibel's tests, evals and demo (docs/18)"
requires-python = ">=3.12"
dependencies = [
    "reportlab>=4.2",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "pillow>=10.3",
    "openpyxl>=3.1.2",
    "pyyaml>=6.0.1",
    "click>=8.1",
]

[project.scripts]
kredibel-synth = "kredibel_synth.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "pdfplumber>=0.11",
    "imagehash>=4.3.1",
    "ruff>=0.4",
    "pyright>=1.1.360",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kredibel_synth"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["kredibel_synth", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
