# Kredibel CI/CD Pipeline
# See docs/16-infrastructure-and-deployment.md §8

steps:
  # 1. Quality and secret checks
  - name: 'python:3.12-slim'
    id: 'checks'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        python tools/checks/scan_secrets.py
        python tools/checks/no_long_prompts.py
        python tools/checks/schema_drift.py

  # 2. Build multi-stage container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_FIREBASE_API_KEY=$_VITE_FIREBASE_API_KEY'
      - '--build-arg'
      - 'VITE_FIREBASE_AUTH_DOMAIN=$_VITE_FIREBASE_AUTH_DOMAIN'
      - '--build-arg'
      - 'VITE_FIREBASE_PROJECT_ID=$_VITE_FIREBASE_PROJECT_ID'
      - '--build-arg'
      - 'VITE_FIREBASE_APP_ID=$_VITE_FIREBASE_APP_ID'
      - '--build-arg'
      - 'VITE_APP_VERSION=$_COMMIT_SHA'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/kredibel/app:$_COMMIT_SHA'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/kredibel/app:latest'
      - '.'

  # 3. Push container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/kredibel/app:$_COMMIT_SHA'
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args:
      - 'push'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/kredibel/app:latest'

  # 5a. Deploy Firestore indexes and rules
  - name: 'node:22-slim'
    id: 'firestore-indexes'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npx --yes firebase-tools deploy --only firestore:indexes,firestore:rules --project "$PROJECT_ID" --config infra/firebase.json || true

  # 5b. Deploy and run kredibel-migrate job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'migrate'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Updating kredibel-migrate job..."
        gcloud run jobs deploy kredibel-migrate \
          --image="asia-southeast1-docker.pkg.dev/$PROJECT_ID/kredibel/app:$_COMMIT_SHA" \
          --region=asia-southeast1 \
          --service-account="kredibel-migrate@$PROJECT_ID.iam.gserviceaccount.com" \
          --set-env-vars=APP_ROLE=migrate,PROJECT_ID=$PROJECT_ID,BACKUPS_BUCKET=$PROJECT_ID-kredibel-backups \
          --command=python --args=-m,migrations,run \
          --tasks=1 --max-retries=1 --task-timeout=3600s --cpu=1 --memory=1Gi \
          --labels=app=kredibel,component=migrate || true
        echo "Executing migration job..."
        gcloud run jobs execute kredibel-migrate --args=-m,migrations,run --region=asia-southeast1 --wait || true

  # 6. Deploy worker service (IAM authenticated only)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-worker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy kredibel-worker \
          --image="asia-southeast1-docker.pkg.dev/$PROJECT_ID/kredibel/app:$_COMMIT_SHA" \
          --region=asia-southeast1 \
          --no-allow-unauthenticated \
          --service-account="kredibel-worker@$PROJECT_ID.iam.gserviceaccount.com" \
          --cpu=2 --memory=2Gi --concurrency=4 --timeout=900 \
          --max-instances=3 --labels=app=kredibel,component=worker \
          --env-vars-file=infra/env.worker.yaml

  # 7. Deploy web service (public HTTPS)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-web'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        WORKER_URL=$$(gcloud run services describe kredibel-worker --region=asia-southeast1 --format='value(status.url)')
        cp infra/env.web.yaml infra/env.web.resolved.yaml
        echo "WORKER_URL: \"$$WORKER_URL\"" >> infra/env.web.resolved.yaml
        gcloud run deploy kredibel-web \
          --image="asia-southeast1-docker.pkg.dev/$PROJECT_ID/kredibel/app:$_COMMIT_SHA" \
          --region=asia-southeast1 \
          --allow-unauthenticated \
          --service-account="kredibel-web@$PROJECT_ID.iam.gserviceaccount.com" \
          --cpu=1 --memory=1Gi --concurrency=40 --timeout=60 \
          --max-instances=5 --labels=app=kredibel,component=web \
          --env-vars-file=infra/env.web.resolved.yaml
        gcloud run services add-iam-policy-binding kredibel-web --region=asia-southeast1 --member=allUsers --role=roles/run.invoker || true

  # 8. Extract built frontend and deploy to Firebase Hosting
  - name: 'gcr.io/cloud-builders/docker'
    id: 'extract-dist'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        id=$$(docker create asia-southeast1-docker.pkg.dev/$PROJECT_ID/kredibel/app:$_COMMIT_SHA)
        docker cp $$id:/app/frontend/dist frontend/dist
        docker rm $$id

  - name: 'node:22-slim'
    id: 'deploy-hosting'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npx --yes firebase-tools deploy --only hosting --project "$PROJECT_ID" || true

  # 9. Smoke verification
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'smoke'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        WEB_URL=$$(gcloud run services describe kredibel-web --region=asia-southeast1 --format='value(status.url)')
        echo "Verifying Cloud Run deployment at $$WEB_URL..."
        curl -fsS "$$WEB_URL/api/health"
        echo "Verifying Firebase Hosting deployment at https://kredibel-app.web.app..."
        curl -fsS "https://kredibel-app.web.app/api/health"

images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/kredibel/app:$_COMMIT_SHA'
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/kredibel/app:latest'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _COMMIT_SHA: 'latest'
  _VITE_FIREBASE_API_KEY: ''
  _VITE_FIREBASE_AUTH_DOMAIN: 'cloud-hack2skill.firebaseapp.com'
  _VITE_FIREBASE_PROJECT_ID: 'cloud-hack2skill'
  _VITE_FIREBASE_APP_ID: '1:110491117045:web:d72e6e2372744a119bacbc'
