[project]
name = "kredibel-backend"
version = "0.1.0"
description = "Kredibel AI finance workspace backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "firebase-admin>=6.5.0",
    "google-cloud-firestore>=2.16.0",
    "google-cloud-storage>=2.16.0",
    "google-cloud-tasks>=2.16.0",
    "google-cloud-documentai>=2.29.0",
    "google-cloud-modelarmor>=0.7.0",
    "google-genai>=0.1.1",
    "google-adk>=2.9.0",
    "pikepdf>=8.15.0",
    "pdfplumber>=0.11.0",
    "pypdfium2>=4.30.0",
    "pillow>=10.3.0",
    "imagehash>=4.3.1",
    "openpyxl>=3.1.2",
    "rapidfuzz>=3.9.0",
    "python-ulid>=2.4.0",
    "anyio>=4.4.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-gcp-trace>=1.6.0",
    "pyyaml>=6.0.1",
    "opentelemetry-exporter-otlp-proto-http>=1.36",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "pyright>=1.1.360",
    "import-linter>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pyright]
include = ["app", "tests"]
extraPaths = [".."]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["..", "."]
