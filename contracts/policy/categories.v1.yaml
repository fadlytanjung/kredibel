# Kredibel categories — version 1
# The category vocabulary for bank lines and ledger entries, the statement line each category rolls up
# to, and where it goes in the statement of cash flows under the workspace's accounting framework
# (profile.accountingFramework). Semantics: docs/08-risk-engine.md §4.1 and ADR-016. Cash-flow class and
# statement line are derived by code from this file; a model never sets them.
#
# Cash-flow class
#   IFRS: IAS 7 as amended by IFRS 18 (periods beginning on or after 1 Jan 2027), for an entity without
#     a specified main business activity: interest and dividends paid are financing, interest and
#     dividends received are investing. Earlier periods allow a policy choice; Kredibel applies the
#     IFRS 18 classification for comparability and says so in the UI.
#   US_GAAP: ASC 230: interest paid, interest received and dividends received are operating; dividends
#     paid are financing.
# Statement lines are cash-basis groupings for the dashboard (not an accrual income statement); their
# names follow each framework's usual wording.
# ⚠️ An accountant should confirm these mappings before any real-data pilot.

version: 1
id: categories.v1
frameworks: [IFRS, US_GAAP]
defaultFramework: IFRS

lines:
  REVENUE:            { order: 1, ifrs: "Revenue",                    usGaap: "Net sales" }
  OTHER_INCOME:       { order: 2, ifrs: "Other income",               usGaap: "Other income" }
  COST_OF_SALES:      { order: 3, ifrs: "Cost of sales",              usGaap: "Cost of goods sold" }
  OPERATING_EXPENSES: { order: 4, ifrs: "Operating expenses",         usGaap: "Selling, general and administrative", split: true }
  INCOME_TAX:         { order: 5, ifrs: "Taxes paid",                 usGaap: "Taxes paid" }
  FINANCE_COSTS:      { order: 6, ifrs: "Finance costs",              usGaap: "Interest expense" }
  INVESTING:          { order: 7, ifrs: "Equipment and investments",  usGaap: "Capital expenditures" }
  FINANCING:          { order: 8, ifrs: "Loans and owner",            usGaap: "Loans and owner", split: true }
  NONE:               { order: 9, ifrs: "Not a cash flow",            usGaap: "Not a cash flow" }

categories:
  # counterpartyRole: the role a line's party gets from this category (docs/08 §4.2);
  # pnlLine, subledger: the P&L line and subledger a line of this category stands for in the cash-basis
  #   profit and loss (ADR-027 amendment; profit-loss.v1.yaml); none for transfers, reversals and UNKNOWN.
  # bucket: the named counterparty for rows of this category that name nobody.
  # ---------------------------------------------------------------- money in
  - { id: SALES_RECEIPT,          direction: in,  line: REVENUE,            label: "Sales receipts",            ifrs: OPERATING, usGaap: OPERATING, counterpartyRole: CLIENT, bucket: "Cash sales", pnlLine: REVENUE, subledger: SALES }
  - { id: OTHER_OPERATING_INCOME, direction: in,  line: OTHER_INCOME,       label: "Other operating income",    ifrs: OPERATING, usGaap: OPERATING, counterpartyRole: OTHER, bucket: "Other income", pnlLine: OTHER_INCOME, subledger: OTHER }
  - { id: INTEREST_RECEIVED,      direction: in,  line: OTHER_INCOME,       label: "Interest received",         ifrs: INVESTING, usGaap: OPERATING, counterpartyRole: OTHER, bucket: "Bank interest", pnlLine: OTHER_INCOME, subledger: FINANCE }
  - { id: ASSET_SALE,             direction: in,  line: INVESTING,          label: "Sale of equipment",         ifrs: INVESTING, usGaap: INVESTING, counterpartyRole: OTHER, bucket: "Asset sales", pnlLine: BALANCE_SHEET, subledger: EQUIPMENT }
  - { id: LOAN_DISBURSEMENT,      direction: in,  line: FINANCING,          label: "Loan received",             ifrs: FINANCING, usGaap: FINANCING, counterpartyRole: LENDER, bucket: "Loans received", pnlLine: BALANCE_SHEET, subledger: OWNER_AND_LOANS }
  - { id: OWNER_CAPITAL,          direction: in,  line: FINANCING,          label: "Owner's capital",           ifrs: FINANCING, usGaap: FINANCING, counterpartyRole: OWNER, bucket: "Owner capital", pnlLine: BALANCE_SHEET, subledger: OWNER_AND_LOANS }
  # ---------------------------------------------------------------- money out
  - { id: INVENTORY_PURCHASE,      direction: out, line: COST_OF_SALES,      label: "Purchases for sale or production", ifrs: OPERATING, usGaap: OPERATING, use: SUPPLIERS, counterpartyRole: SUPPLIER, bucket: "Purchases", pnlLine: COST_OF_SALES, subledger: PURCHASES }
  - { id: SUPPLIER_PAYMENT,        direction: out, line: OPERATING_EXPENSES, label: "Other suppliers and services",    ifrs: OPERATING, usGaap: OPERATING, use: SUPPLIERS, counterpartyRole: SUPPLIER, bucket: "Suppliers and services", pnlLine: OPERATING_EXPENSES, subledger: SERVICES }
  - { id: PAYROLL,                 direction: out, line: OPERATING_EXPENSES, label: "Payroll",                 ifrs: OPERATING, usGaap: OPERATING, use: PAYROLL, counterpartyRole: OTHER, bucket: "Payroll", pnlLine: OPERATING_EXPENSES, subledger: PAYROLL }
  - { id: RENT,                    direction: out, line: OPERATING_EXPENSES, label: "Rent",                    ifrs: OPERATING, usGaap: OPERATING, use: RENT_UTILITIES, counterpartyRole: OTHER, bucket: "Rent", pnlLine: OPERATING_EXPENSES, subledger: OCCUPANCY }
  - { id: UTILITIES,               direction: out, line: OPERATING_EXPENSES, label: "Utilities",               ifrs: OPERATING, usGaap: OPERATING, use: RENT_UTILITIES, counterpartyRole: OTHER, bucket: "Utilities", pnlLine: OPERATING_EXPENSES, subledger: OCCUPANCY }
  - { id: BANK_FEES,               direction: out, line: OPERATING_EXPENSES, label: "Bank fees",               ifrs: OPERATING, usGaap: OPERATING, use: OTHER, counterpartyRole: OTHER, bucket: "Bank fees", pnlLine: OPERATING_EXPENSES, subledger: FINANCE }
  - { id: OTHER_OPERATING_EXPENSE, direction: out, line: OPERATING_EXPENSES, label: "Other spending",          ifrs: OPERATING, usGaap: OPERATING, use: OTHER, counterpartyRole: OTHER, bucket: "Other spending", pnlLine: OPERATING_EXPENSES, subledger: OTHER }
  # Cash taken out of the bank is money out: Kredibel keeps no cash book, so what it paid for is
  # unknown until a receipt shows it (product decision 16 Oct 2026; not a transfer between own accounts).
  - { id: CASH_WITHDRAWAL,         direction: out, line: OPERATING_EXPENSES, label: "Cash withdrawals",        ifrs: OPERATING, usGaap: OPERATING, use: OTHER, counterpartyRole: OTHER, bucket: "Cash withdrawals", pnlLine: OPERATING_EXPENSES, subledger: OTHER }
  - { id: TAX_PAYMENT,             direction: out, line: INCOME_TAX,         label: "Tax",                     ifrs: OPERATING, usGaap: OPERATING, use: TAX, counterpartyRole: GOVERNMENT, bucket: "Tax payments", pnlLine: INCOME_TAX, subledger: TAX }
  - { id: INTEREST_PAID,           direction: out, line: FINANCE_COSTS,      label: "Interest paid",           ifrs: FINANCING, usGaap: OPERATING, use: LOANS, counterpartyRole: LENDER, bucket: "Loan interest", pnlLine: FINANCE_COSTS, subledger: FINANCE }
  - { id: ASSET_PURCHASE,          direction: out, line: INVESTING,          label: "Equipment bought",        ifrs: INVESTING, usGaap: INVESTING, use: SUPPLIERS, counterpartyRole: SUPPLIER, bucket: "Equipment and assets", pnlLine: BALANCE_SHEET, subledger: EQUIPMENT }
  - { id: LOAN_REPAYMENT,          direction: out, line: FINANCING,          label: "Loan principal repaid",   ifrs: FINANCING, usGaap: FINANCING, use: LOANS, counterpartyRole: LENDER, bucket: "Loan payments", pnlLine: BALANCE_SHEET, subledger: OWNER_AND_LOANS }
  - { id: OWNER_DRAWING,           direction: out, line: FINANCING,          label: "Owner drawings",          ifrs: FINANCING, usGaap: FINANCING, use: OWNER, counterpartyRole: OWNER, bucket: "Owner drawings", pnlLine: BALANCE_SHEET, subledger: OWNER_AND_LOANS }
  # ---------------------------------------------------------------- not cash flows of the business
  - { id: INTERNAL_TRANSFER,       direction: either, line: NONE, label: "Between own accounts", ifrs: NON_CASH, usGaap: NON_CASH, counterpartyRole: OWN_ACCOUNT, bucket: "Own accounts" }
  - { id: REVERSAL,                direction: either, line: NONE, label: "Reversal",             ifrs: NON_CASH, usGaap: NON_CASH, counterpartyRole: OTHER, bucket: "Reversals" }
  - { id: UNKNOWN,                 direction: either, line: NONE, label: "Not categorized yet",  ifrs: UNCLASSIFIED, usGaap: UNCLASSIFIED, use: UNCATEGORIZED, counterpartyRole: OTHER, bucket: "Not categorized yet" }

# ---------------------------------------------------------------- money-flow chart (docs/08 §5.1)
# Statement lines with `split: true` show one node per category in the chart's last column. `use`
# groups money out by who was paid for the "By client and supplier" view. Labels are the same in
# both frameworks; frameworkNotes is the sentence under the chart when interest is in the period.
uses:
  SUPPLIERS: "Suppliers"
  PAYROLL: "Payroll"
  RENT_UTILITIES: "Rent and utilities"
  TAX: "Tax"
  LOANS: "Loan payments"
  OWNER: "Owner drawings"
  OTHER: "Other spending"
  UNCATEGORIZED: "Not categorized yet"

flowLabels:
  OPERATING: "Operating"
  INVESTING: "Investing"
  FINANCING: "Financing"
  otherClients: "Other clients"
  cashSales: "Cash sales deposited"
  takenFromBalance: "Taken from balance"
  kept: "Kept"
  keptInAccount: "Kept in the account"
  uncategorized: "Not categorized yet"
  fromOwnAccounts: "From own accounts"
  toOwnAccounts: "To own accounts"
  bankAccount: "Bank account"

frameworkNotes:
  IFRS: "Under IFRS, interest paid is a financing cash flow and interest received an investing one."
  US_GAAP: "Under US GAAP, interest paid and interest received are operating cash flows."
