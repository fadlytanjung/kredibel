<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Kredibel cover</title><link rel="stylesheet" href="../../cards/card.css">
<!-- The LinkedIn cover (1920x1080) for the Meet the Builders post: docs/submission/meet-the-builders/linkedin-cover.png. -->
<style>
  .cover { display: grid; grid-template-columns: 760px 1fr; gap: 72px; align-items: center; height: 100%; padding: 110px 0 110px 120px; }
  .cover .logo { height: 84px; }
  .cover h1 { font-size: 76px; line-height: 1.05; font-weight: 740; font-stretch: 112%; letter-spacing: -.012em; margin-top: 44px; }
  .cover p.lead { font-size: 32px; line-height: 1.4; color: var(--muted); margin-top: 28px; }
  .cover .chips { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 40px; }
  .cover .chips span { font-size: 24px; font-weight: 640; padding: 12px 22px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); }
  .cover .foot { margin-top: 48px; font-size: 30px; color: var(--ink); font-weight: 680; }
  .cover .foot b { color: var(--brand); }
  .shot { justify-self: start; width: 1040px; border-radius: 22px; overflow: hidden; border: 1.5px solid #D5DCE1;
    box-shadow: 0 30px 80px rgba(22,33,43,.18), 0 6px 18px rgba(22,33,43,.08); }
  .shot img { display: block; width: 100%; }
</style></head>
<body><div class="cover">
  <div>
    <img class="logo" src="../../../../design/brand/kredibel-logo.svg" alt="Kredibel">
    <h1>Your books, checked and ready for a lender.</h1>
    <p class="lead">Gemini reads every page, code checks every value, every month reconciles itself, and the new loan readiness report says what to fix first.</p>
    <div class="chips"><span>Gemini on Vertex AI</span><span>Document AI</span><span>Agent Development Kit</span></div>
    <p class="foot"><b>kredibel.app</b> · #Meetthebuilders</p>
  </div>
  <div class="shot"><img src="../../../../docs/submission/meet-the-builders/readiness-screen.png" alt="The loan readiness report"></div>
</div></body></html>
