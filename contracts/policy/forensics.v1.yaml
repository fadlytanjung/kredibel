# Kredibel checks — version 1
# Which checks run, and their thresholds. Semantics: docs/08-risk-engine.md §2–§3.
# A check runs only if its code is listed under `enabled` (P1 checks are switched on when built).

version: 1
id: forensics.v1

enabled:
  # P0
  - E01_LOW_EXTRACTION_AGREEMENT
  - E02_EXTRACTION_FAILED
  - E03_UNCERTAIN_TYPE
  - E05_PARTY_UNCLEAR
  - D01_EXACT_FILE_DUPLICATE
  - D02_STATEMENT_PERIOD_DUPLICATE
  - D03_INVOICE_DUPLICATE
  - D04_INVOICE_NUMBER_REUSED
  - D05_RECEIPT_DUPLICATE
  - D06_LEDGER_ENTRY_DUPLICATE
  - D07_DOUBLE_PAYMENT
  - A01_RUNNING_BALANCE_BREAK
  - A02_OPENING_CLOSING_MISMATCH
  - A04_INVOICE_TOTAL_MISMATCH
  - M01_EDITING_SOFTWARE_PRODUCER
  - M02_MODIFIED_AFTER_CREATION
  - M03_MULTIPLE_REVISIONS
  - M04_FONT_ANOMALY_IN_VALUES
  - M06_IMAGE_ONLY
  - X01_STATEMENT_DISCONTINUITY
  - X02_STATEMENT_MISSING
  - X05_ACCOUNT_HOLDER_MISMATCH
  - X06_UNDECLARED_ACCOUNT
  - X08_SUPPLIER_ACCOUNT_CHANGED
  - X09_LEDGER_BANK_MISMATCH
  - R01_SALES_INVOICE_OVERDUE
  - R02_SUPPLIER_INVOICE_UNKNOWN_PARTY
  - B01_GAMBLING_INDICATORS
  - B04_RETURNED_ITEMS
  - C02_NEGATIVE_BALANCE_DAYS
  # P1 — uncomment as each is implemented
  # - S01_EMBEDDED_INSTRUCTIONS
  # - E04_MULTIPLE_ACCOUNTS
  # - A03_PRINTED_TOTALS_MISMATCH
  # - A05_TAX_RATE_INCONSISTENT
  # - M05_COVERED_TEXT
  # - V01_VISUAL_EDIT_SUSPECTED
  # - X07_TAX_ID_MISMATCH
  # - R03_PAID_BEFORE_ISSUE
  # - B03_ROUND_TRIPPING

duplicates:
  statementOverlapMinDays: 1
  invoiceIssuerMinScore: 90         # rapidfuzz token_set_ratio
  receiptTotalToleranceMinor: 100
  pHashMaxDistance: 8               # 64-bit perceptual hash of page 1 (receipts and images)
  ledgerKey: [date, amountMinor, accountCode, reference]

arithmetic:
  balanceToleranceMinor: 100        # 1.00 currency unit
  invoiceLineToleranceMinor: 100
  vatRates: ["0.11", "0.12"]
  vatToleranceAbs: "0.005"

structure:
  # Generic, configurable patterns for consumer editing tools in Producer/Creator. Weak signal alone.
  editorProducerPatterns:
    - '(?i)pdf ?editor'
    - '(?i)online ?pdf'
    - '(?i)\bword\b'
    - '(?i)libreoffice|openoffice'
    - '(?i)photoshop|gimp|canva'
    - '(?i)\bpypdf\b'
  modifiedAfterCreationMinutes: 10
  fontAnomaly:
    majorityShare: "0.90"           # a font used by ≥90% of a numeric column's values is "normal"
    minValuesInColumn: 5

visual:
  maxSeverityUncorroborated: MEDIUM
  corroborationIou: "0.3"
  renderDpi: 150

crossDocument:
  holderNameMinScore: 80            # token_set_ratio against the workspace's names, aliases, account holders
  continuityToleranceMinor: 100
  undeclaredAccountSeverity: LOW    # X06; also creates a BANK_ACCOUNT suggestion
  ledgerMonthDifferenceHigh: "0.05" # X09 HIGH when the month's ledger cash movement differs by > 5%

profile:
  aliasNameMinScore: 90
  relatedPartyMinMonths: 3          # P1

verification:                       # AI reader vs witness (docs/07 §6)
  descriptionMinScore: 85           # rapidfuzz partial_ratio
  textLayerMinChars: 40
  textLayerMinPrintableShare: "0.80"
  blankPageWhiteShare: "0.995"

reconciliationChecks:
  overdueGraceDays: 30              # R01 after due date + grace
  overdueMediumShare: "0.10"
  paidBeforeIssueDays: 3            # R03 (P1)

behaviour:
  gamblingMinCount: 1
  returnedItemsMedium: 1
  returnedItemsHigh: 3
  negativeDaysThreshold: 3
  roundTrip:                        # P1
    maxDays: 2
    amountTolerance: "0.02"
    minOccurrences: 2

verdict:
  integrityCategories: [SCREENING, EXTRACTION, ARITHMETIC, STRUCTURE, VISUAL]
  tamperedCodes: [A01_RUNNING_BALANCE_BREAK, A02_OPENING_CLOSING_MISMATCH, M03_MULTIPLE_REVISIONS]
  suspiciousMediumCount: 2
