version: "3.8"

services:
  # Optional local tracing; in-memory storage is cleared when this container stops.
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    profiles: [tracing]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

  # Local Firestore Emulator for development and testing
  firestore:
    image: google/cloud-sdk:emulators
    container_name: kredibel-firestore-emulator
    command: gcloud beta emulators firestore start --host-port=0.0.0.0:8080
    ports:
      - "8080:8080"
    environment:
      - FIRESTORE_PROJECT_ID=cloud-hack2skill
    volumes:
      - firestore-data:/opt/data
    restart: unless-stopped

volumes:
  firestore-data:
