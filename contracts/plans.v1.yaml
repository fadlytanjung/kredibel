# Kredibel plans — version 1
# Plan catalog and entitlements. Loaded and validated at startup (backend/app/domain/plans.py).
# Semantics: docs/specs/013-workspace-and-plans/spec.md and ADR-011.
# Only plans with status AVAILABLE can be assigned. COMING_SOON plans are shown, disabled, with no price.
# Global env guardrails (RUNS_ENABLED, RUN_QUOTA_PER_ORG_PER_DAY, SIGNUP_MODE, MAX_WORKSPACES) apply on top.

version: 1
id: plans.v1
defaultPlan: free_trial

plans:
  - id: free_trial
    label: Free trial
    status: AVAILABLE
    priceLabel: "Free for 30 days"
    trialDays: 30
    afterTrial: READ_ONLY            # everything stays readable; no new uploads, reading or assistant
    limits:
      seats: 3                       # members including the owner (roles are P1; P0 has one owner)
      documentsPerMonth: 150         # uploads per calendar month (UTC); exact duplicates do not count
      pagesPerDocument: 20
      fileSizeMb: 20
      extractedPagesPerMonth: 400    # pages sent to the AI reader; cache hits and duplicates are not counted
      ledgerRowsPerFile: 5000        # CSV/XLSX rows per ledger export
      monthRunsPerDay: 60            # month reconciliations per day (each upload or fix may trigger one)
      aiSpendUsdPerMonth: "5.00"     # estimated from metered usage (docs/21 §3); blocks new reading when reached
      assistantQuestionsPerDay: 50   # P1
    features:
      extractionMode: adaptive       # adaptive | thorough (docs/07 §5)
      escalation: true               # P1; re-read low-agreement pages with a Document AI parser
      escalationPagesPerMonth: 30
      financeAssistant: true         # P1, when built
      memberInvites: true            # P1
      monthSignOff: true             # P1
      languages: [en]
    highlights:
      - "Every feature of the prototype"
      - "Team invites coming soon"
      - "400 pages read per month"

  - id: starter
    label: Starter
    status: COMING_SOON
    priceLabel: "Pricing announced later"
    highlights:
      - "More documents and pages"
      - "Up to 10 team members"
      - "Email support"

  - id: professional
    label: Professional
    status: COMING_SOON
    priceLabel: "Pricing announced later"
    highlights:
      - "A second reader on every page"
      - "Several workspaces for a firm"
      - "Audit export"

  - id: enterprise
    label: Enterprise
    status: COMING_SOON
    priceLabel: "Contact us later"
    highlights:
      - "Processing in your region"
      - "Single sign-on"
      - "Custom limits"

comingSoonFeatures:
  - id: loan_readiness_report
    label: "Loan readiness report"
    description: "A lender-ready summary of your verified months, built on the same checked data."
  - id: bank_feeds
    label: "Bank feeds"
    description: "Statements arrive by themselves instead of by upload."

languages:
  - { code: en, label: "English", status: available }
  - { code: id, label: "Bahasa Indonesia", status: coming_soon }
  - { code: ms, label: "Bahasa Melayu", status: coming_soon }
  - { code: th, label: "ไทย (Thai)", status: coming_soon }
  - { code: vi, label: "Tiếng Việt", status: coming_soon }
