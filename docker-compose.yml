version: "3.8"

services:
  # Local Firestore Emulator for development and testing
  firestore:
    image: google/cloud-sdk:emulators
    container_name: kredibel-firestore-emulator
    command: gcloud beta emulators firestore start --host-port=0.0.0.0:8080
    ports:
      - "8080:8080"
    environment:
      - FIRESTORE_PROJECT_ID=cloud-hack2skill
    volumes:
      - firestore-data:/opt/data
    restart: unless-stopped

volumes:
  firestore-data:
