# Kredibel reconciliation — version 1
# Matching windows, tolerances, weights and thresholds. Semantics: docs/08-risk-engine.md §6–§7.

version: 1
id: reconciliation.v1

amountTolerance:
  minMinor: 100000                  # legacy IDR-only synthetic generator; not a runtime fallback
  minimumByCurrency:               # major units; no FX conversion or default currency
    IDR: "1000"
    MYR: "0.01"
    SGD: "0.01"
    JPY: "1"
    USD: "0.01"
  share: "0.005"                    # 0.5% of the amount, whichever is larger
maxWithholding: "0.02"              # net-of-tax payments up to 2% below the total
withholdingRates: ["0.10"]          # known rates above maxWithholding (PPh 4(2) on rent, construction): proposal
feeAllowance:                       # money in short by at most this: a fee the paying bank took (proposal)
  IDR: "10000"
  MYR: "2"
  SGD: "2"
  JPY: "500"
  USD: "1"
netOfTaxAmountScore: "0.8"          # proposal only until a person confirms the adjustment

reasonThresholds:
  party: "0.80"
  date: "0.90"

windows:
  invoiceBeforeIssueDays: 5         # a payment may arrive up to 5 days before the invoice date (H-5)
  defaultTermsDays: 30              # due date when the invoice has none
  graceDays: 30                     # after the due date
  receiptDays: 5                    # card and QR settlements arrive up to H+5 (weekends, holidays)
  ledgerDays: 3                     # exact amount on a mapped account; ±5 made monthly bookings of the same amount rivals
  neighbourMonths: 1                # reconcile_month also looks at ±1 month for cross-month payments

weights:
  amount: "0.45"
  party: "0.25"
  reference: "0.15"
  date: "0.15"

thresholds:
  autoConfirmScore: "0.85"
  ambiguityMargin: "0.10"
  proposeScore: "0.60"
  partyMinScoreForSplit: "0.80"
  maxSplitParts: 3                  # several bank rows for one document
  maxGroupParts: 8                  # one bank row for several documents of one party (subset sum)
  maxAutoGroupParts: 3              # a larger group is always a proposal

ledger:
  bankAccountMapping: user          # the user maps each bank account to a ledger account code once
  cashAccountHints: ["1100", "1110", "bank", "cash at bank"]   # used only to pre-fill the mapping

ledgerCash:                         # docs/08 §6.2: a line no document explains, against its booking on the mapped account
  rivalDays: 5                      # another line or booking of the same amount within ±5 days: never automatic
  minParty: "0.50"                  # the booking's words (description or counter-account) must name the line, or its reference be printed

reviewItems:
  waitForStatement: true            # no UNMATCHED_DOCUMENT items for a month without a statement
  unsupportedBankLine: informational # support absence alone does not create a blocking item
